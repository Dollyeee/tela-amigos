<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Tela Amigos - mãozinha</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", sans-serif; }
    canvas { position: absolute; inset: 0; }
    .hand { position: absolute; width: 44px; height: 44px; margin: -4px 0 0 -14px; transition: left .05s linear, top .05s linear;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); transform-origin: 14px 4px; }
    .hand span { position: absolute; left: 40px; top: 34px; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap;
      background: var(--c); padding: 2px 8px; border-radius: 6px; }
    .hand.pressing { animation: press .35s ease-out; }
    @keyframes press { 0% { transform: scale(1); } 40% { transform: scale(.82) translateY(3px); } 100% { transform: scale(1); } }
    .ripple { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 4px solid var(--c);
      animation: ripple .65s ease-out forwards; }
    @keyframes ripple { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(4.5); opacity: 0; } }
  </style>
</head>
<body>
<canvas id="trail"></canvas>
<script>
  // mãozinhas que os amigos estão usando na minha tela (esta janela fica fora da captura)
  const HAND = '<svg viewBox="0 0 32 32" width="44" height="44"><path d="M11 3.5c1.4 0 2.5 1.1 2.5 2.5v8.2l.6-.1c1.3-.2 2.4.6 2.7 1.8l.1.4.5-.1c1.3-.2 2.4.6 2.7 1.8l.1.3.4-.1c1.4-.2 2.6.8 2.7 2.2l.4 4.2c.2 2.6-1.1 5-3.4 6.2l-.8.4c-1.2.6-2.5.9-3.9.9h-1.2c-2.4 0-4.6-1.2-5.9-3.2l-4.3-6.6c-.7-1.1-.4-2.6.7-3.3 1-.6 2.3-.4 3.1.4L8.5 22V6c0-1.4 1.1-2.5 2.5-2.5z" fill="var(--c)" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  const hands = {};
  const lines = [];
  const canvas = document.getElementById('trail');
  let animating = false;
  function drawTrail() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    const g = canvas.getContext('2d');
    const now = performance.now();
    // cada traço tem sua duração (rastro 2,5 s; caneta ~8 s, some só no final)
    for (let i = lines.length - 1; i >= 0; i--) if (now - lines[i].t > (lines[i].life || 2500)) lines.splice(i, 1);
    for (const s of lines) {
      const life = s.life || 2500, age = now - s.t;
      g.globalAlpha = s.life ? Math.max(0, Math.min(1, (life - age) / 1200)) : Math.max(0, 1 - age / 2500);
      g.strokeStyle = s.color; g.lineWidth = s.life ? 6 : 7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(s.x1 * innerWidth, s.y1 * innerHeight); g.lineTo(s.x2 * innerWidth, s.y2 * innerHeight); g.stroke();
    }
    if (lines.length) requestAnimationFrame(drawTrail); else animating = false;
  }
  window.pointerApi.onPointer((p) => {
    // caneta: lote de traços que ficam alguns segundos; ou "limpar" os traços de alguém
    if (p.inkClear) {
      for (let i = lines.length - 1; i >= 0; i--) if (lines[i].id === p.id) lines.splice(i, 1);
      if (!animating) { animating = true; requestAnimationFrame(drawTrail); } // redesenha (apaga da tela)
      return;
    }
    if (p.inkSegs) {
      const t = performance.now();
      for (const [x1, y1, x2, y2] of p.inkSegs) lines.push({ x1, y1, x2, y2, color: p.color, t, life: p.life || 8000, id: p.id });
      if (!animating) { animating = true; requestAnimationFrame(drawTrail); }
      return;
    }
    // esta janela (tela inteira) agora só desenha o RASTRO; a mão é uma janelinha à parte
    if (p.trailOnly) {
      const prev = hands[p.id];
      if (prev && prev.lastX != null) {
        lines.push({ x1: prev.lastX, y1: prev.lastY, x2: p.x, y2: p.y, color: p.color, t: performance.now() });
        if (!animating) { animating = true; requestAnimationFrame(drawTrail); }
      }
      hands[p.id] = { lastX: p.drawing ? p.x : null, lastY: p.drawing ? p.y : null };
      return;
    }
    let h = hands[p.id];
    if (!h) {
      h = document.createElement('div');
      h.className = 'hand';
      h.innerHTML = HAND;
      const s = document.createElement('span');
      s.textContent = p.name;
      h.appendChild(s);
      document.body.appendChild(h);
      hands[p.id] = h;
    }
    h.style.setProperty('--c', p.color);
    if (p.drawing && h.lastX != null) {
      lines.push({ x1: h.lastX, y1: h.lastY, x2: p.x, y2: p.y, color: p.color, t: performance.now() });
      if (!animating) { animating = true; requestAnimationFrame(drawTrail); }
    }
    h.lastX = p.drawing ? p.x : null; h.lastY = p.drawing ? p.y : null;
    h.style.left = `${p.x * innerWidth}px`;
    h.style.top = `${p.y * innerHeight}px`;
    if (p.press) {
      h.classList.remove('pressing'); void h.offsetWidth; h.classList.add('pressing');
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.setProperty('--c', p.color);
      r.style.left = h.style.left; r.style.top = h.style.top;
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 700);
    }
    clearTimeout(h.timer);
    h.timer = setTimeout(() => { h.remove(); delete hands[p.id]; }, 1500);
  });
  window.pointerApi.onHide((id) => { if (hands[id]) { hands[id].remove(); delete hands[id]; } });
</script>
</body>
</html>
