<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Tela Amigos - mãozinha</title>
  <style>
    /* janelinha pequena que acompanha a mão (a ponta do dedo fica em 60,50) */
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", sans-serif; }
    .hand { position: absolute; left: 46px; top: 46px; width: 44px; height: 44px; transform-origin: 14px 4px;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
    .hand.pressing { animation: press .35s ease-out; }
    @keyframes press { 0% { transform: scale(1); } 40% { transform: scale(.82) translateY(3px); } 100% { transform: scale(1); } }
    .tag { position: absolute; left: 86px; top: 80px; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap;
      background: var(--c); padding: 2px 8px; border-radius: 6px; }
    .ripple { position: absolute; left: 60px; top: 50px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 4px solid var(--c); animation: ripple .65s ease-out forwards; }
    @keyframes ripple { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(4.2); opacity: 0; } }
  </style>
</head>
<body>
  <div class="hand" id="hand"><svg viewBox="0 0 32 32" width="44" height="44"><path d="M11 3.5c1.4 0 2.5 1.1 2.5 2.5v8.2l.6-.1c1.3-.2 2.4.6 2.7 1.8l.1.4.5-.1c1.3-.2 2.4.6 2.7 1.8l.1.3.4-.1c1.4-.2 2.6.8 2.7 2.2l.4 4.2c.2 2.6-1.1 5-3.4 6.2l-.8.4c-1.2.6-2.5.9-3.9.9h-1.2c-2.4 0-4.6-1.2-5.9-3.2l-4.3-6.6c-.7-1.1-.4-2.6.7-3.3 1-.6 2.3-.4 3.1.4L8.5 22V6c0-1.4 1.1-2.5 2.5-2.5z" fill="var(--c)" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
  <div class="tag" id="tag"></div>
<script>
  const hand = document.getElementById('hand'), tag = document.getElementById('tag');
  window.pointerApi.onPointer((p) => {
    document.body.style.setProperty('--c', p.color);
    tag.textContent = p.name;
    if (p.press) {
      hand.classList.remove('pressing'); void hand.offsetWidth; hand.classList.add('pressing');
      const r = document.createElement('div');
      r.className = 'ripple';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 700);
    }
  });
</script>
</body>
</html>
