<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>Tela Amigos - sobreposição</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <!-- as cores e as letras do tema escolhido no app (a janela principal diz qual é: setup e setTheme) -->
  <link rel="stylesheet" href="tema-janelas.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font: 12px "Segoe UI", sans-serif; color: #fff; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .cam { position: absolute; right: 2.5%; bottom: 6%; width: 24%; aspect-ratio: 16/9; border-radius: var(--j-cam-radius); overflow: hidden;
      border: 2px solid var(--j-cam); display: none; }
    .cam video { object-fit: cover; }
    /* barra no topo: arrasta a janela; botões aparecem com o mouse em cima */
    .bar { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 6px;
      padding: 0 6px 0 10px; background: var(--j-bar); color: var(--j-fg); font: var(--j-font); letter-spacing: var(--j-ls);
      opacity: 0; transition: opacity .15s; -webkit-app-region: drag; }
    body:hover .bar { opacity: 1; }
    .bar .name { flex: 0 1 auto; min-width: 0; margin-right: auto; padding: var(--j-name-pad, 0); border-radius: var(--j-name-radius, 0);
      background: var(--j-name-bg, transparent); text-shadow: var(--j-name-shadow, none); font: var(--j-name); letter-spacing: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar button { -webkit-app-region: no-drag; border: 1px solid var(--j-btn-line); background: var(--j-btn); color: var(--j-btn-fg);
      border-radius: var(--j-radius); padding: 3px 8px; font: inherit; letter-spacing: inherit; text-transform: var(--j-case); cursor: pointer; }
    .bar button:hover { background: var(--j-btn-hover); color: var(--j-btn-hover-fg); }
    .locked-hint { position: absolute; bottom: 6px; left: 8px; font-size: 11px; background: rgba(0,0,0,.6); padding: 2px 8px;
      border-radius: var(--j-radius); display: none; }
    body.locked .locked-hint { display: block; }
    body.locked .bar { display: none; }
    /* travada: cadeado no canto; só ele recebe clique (o resto deixa o mouse atravessar) */
    .unlock { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 8px; border: none;
      background: rgba(0,0,0,.55); color: #fff; font-size: 16px; cursor: pointer; display: none; opacity: .55; }
    .unlock:hover { opacity: 1; background: var(--j-primary); }
    body.locked .unlock { display: block; }
  </style>
</head>
<body>
  <video id="main" autoplay playsinline muted></video>
  <div class="cam" id="camBox"><video id="cam" autoplay playsinline muted></video></div>
  <div class="bar">
    <span class="name" id="name">Tela Amigos</span>
    <button id="less" title="Mais transparente">−</button>
    <button id="more" title="Menos transparente">+</button>
    <button id="lock" title="Travar: o mouse passa através da janela (Ctrl+Shift+O destrava)">Travar</button>
    <button id="close" title="Fechar">✕</button>
  </div>
  <div class="locked-hint" id="hint">Travada · cadeado ou Ctrl+Shift+O destrava</div>
  <button class="unlock" id="unlock" title="Destravar">🔒</button>
<script>
  let opacity = 1;
  // o tema escolhido no app (a janela principal avisa quando ele muda)
  window.setTheme = (id) => { document.documentElement.dataset.theme = String(id || 'classico'); };
  // chamado pela janela principal com os streams do amigo
  window.setup = ({ stream, cam, name, theme }) => {
    window.setTheme(theme);
    document.getElementById('name').textContent = name;
    document.title = `${name} - Tela Amigos`;
    document.getElementById('main').srcObject = stream;
    const camBox = document.getElementById('camBox');
    camBox.style.display = cam ? 'block' : 'none';
    if (cam) document.getElementById('cam').srcObject = cam;
  };
  const setOpacity = (v) => { opacity = Math.max(0.25, Math.min(1, v)); window.overlayApi.opacity(opacity); };
  document.getElementById('less').onclick = () => setOpacity(opacity - 0.15);
  document.getElementById('more').onclick = () => setOpacity(opacity + 0.15);
  document.getElementById('lock').onclick = () => window.overlayApi.lock(true);
  document.getElementById('close').onclick = () => window.close();
  window.overlayApi.onLocked((locked, key) => {
    document.body.classList.toggle('locked', locked);
    if (key) document.getElementById('hint').textContent = `Travada · cadeado ou ${key} destrava`;
  });
  // cadeado: com o mouse em cima, a janela volta a aceitar clique só enquanto ele estiver ali
  const unlock = document.getElementById('unlock');
  unlock.addEventListener('mouseenter', () => window.overlayApi.hoverUnlock(true));
  unlock.addEventListener('mouseleave', () => window.overlayApi.hoverUnlock(false));
  unlock.addEventListener('click', () => window.overlayApi.lock(false));
</script>
</body>
</html>
